name: Gradle unit tests

on:
  push:
    branches:
      - "master"
      - "SCEE-mc"
  pull_request:
    branches:
      - "SCEE-mc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Verify CI diagnostics scripts
        run: |
          set -euo pipefail
          chmod +x .github/scripts/ci-test-with-diagnostics.test.sh
          .github/scripts/ci-test-with-diagnostics.test.sh

      - name: Publish pinned osmfeatures to mavenLocal
        run: |
          set -euo pipefail
          chmod +x third_party/osmfeatures/publish-to-maven-local.sh
          ./third_party/osmfeatures/publish-to-maven-local.sh

      - name: Install xvfb for desktop Compose tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Android host unit tests
        env:
          CI_DIAG_SUITE: testAndroidHostTest
        run: |
          set -euo pipefail
          chmod +x .github/scripts/ci-test-with-diagnostics.sh
          .github/scripts/ci-test-with-diagnostics.sh \
            ./gradlew :app:testAndroidHostTest --no-parallel --console=plain --no-build-cache

      - name: Run desktop unit tests
        env:
          CI_DIAG_SUITE: desktopTest
        run: |
          set -euo pipefail
          chmod +x .github/scripts/ci-test-with-diagnostics.sh
          xvfb-run -a .github/scripts/ci-test-with-diagnostics.sh \
            ./gradlew :app:desktopTest --no-parallel --console=plain --no-build-cache

      - name: Upload test reports and CI diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build/ci-diagnostics/