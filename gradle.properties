# release flavor
app.streetcomplete.monopolistic_app_store=false

# debug settings in the app
app.streetcomplete.debug=false

# Kotlin
kotlin.daemon.jvmargs=-Xmx4096m
kotlin.incremental=true

# Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true

# Android
android.enableJetifier=false
android.useAndroidX=true

# Build scripts
app.streetcomplete.POEditorAPIToken=invalid
app.streetcomplete.POEditorCookie=invalid
app.streetcomplete.POEditorPHPSESSID=invalid
app.streetcomplete.GithubApiToken=invalid

kotlin.incremental=false
org.gradle.caching=false
org.gradle.java.home=C\:/Program Files/Java/jdk-22
kotlin.daemon.jvm.options=-Djava.home=C:/Program Files/Java/jdk-22
kotlin.compiler.execution.strategy=out-of-process
kotlin.compiler.verbose=true
