name: CodeQL

# Advanced Setup for java-kotlin on SCEE-mc (Kotlin Multiplatform + Android + Desktop).
# Disables reliance on CodeQL Default Setup autobuild, which fails here because the
# project requires JDK 25 (buildSrc toolchain) while GitHub's autobuild used Java 17.
#
# After merging: GitHub → Settings → Code security → Code scanning → switch this
# repository from "Default" to "Advanced" setup and disable the Default Setup workflow
# so only this workflow runs (otherwise duplicate/conflicting analyses).

on:
  push:
    branches:
      - "SCEE-mc"
  pull_request:
    branches:
      - "SCEE-mc"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      CI: true
      # ubuntu-latest ≈ 7 GiB RAM. gradle.properties sets org.gradle.jvmargs=-Xmx8g (local/iOS);
      # override on the Gradle CLI so CI does not inherit the 8g heap.
      GRADLE_OPTS: -XX:+UseG1GC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Publish pinned osmfeatures to mavenLocal
        run: |
          set -euo pipefail
          chmod +x third_party/osmfeatures/publish-to-maven-local.sh
          ./third_party/osmfeatures/publish-to-maven-local.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile Kotlin/JVM targets for CodeQL extraction
        run: |
          set -euo pipefail
          chmod +x gradlew
          # CodeQL's Kotlin extractor hooks kotlinc JVM execs; --no-daemon and
          # out-of-process compilation are required so Gradle actually launches
          # traceable compiler processes (see GitHub CodeQL docs for compiled languages).
          ./gradlew \
            "-Dorg.gradle.jvmargs=-Xmx3584m -XX:+UseG1GC -Dfile.encoding=UTF-8" \
            "-Dkotlin.daemon.jvmargs=-Xmx1536m -XX:+UseG1GC" \
            "-Dorg.gradle.parallel=false" \
            :buildSrc:compileKotlin \
            :app:compileAndroidMain \
            :app:compileKotlinDesktop \
            :androidApp:compileDebugKotlin \
            :desktopApp:compileKotlin \
            --rerun-tasks \
            --no-build-cache \
            --no-parallel \
            --no-configuration-cache \
            --no-daemon \
            -Pkotlin.compiler.execution.strategy=out-of-process \
            --console=plain

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4