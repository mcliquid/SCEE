[versions]

kotlin = "2.4.21"
klaxon = "5.6"
countryboundaries = "3.0.0"
kotlinxIo = "0.9.3"
yamlbeans = "1.17"
jsoup = "1.24.1"
kotlinxSerialization = "1.13.0"
kaml = "0.104.0"
snakeyaml = "2.7"
markdown = "0.7.18"
junit = "4.13.2"

[plugins]

kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]

junit = { module = "junit:junit", version.ref = "junit" }
klaxon = { module = "com.beust:klaxon", version.ref = "klaxon" }
countryboundaries = { module = "de.westnordost:countryboundaries", version.ref = "countryboundaries" }
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
yamlbeans = { module = "com.esotericsoftware.yamlbeans:yamlbeans", version.ref = "yamlbeans" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
markdown = { module = "org.jetbrains:markdown", version.ref = "markdown" }
