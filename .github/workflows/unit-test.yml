name: Gradle unit tests

on:
  push:
    branches:
      - "master"
      - "SCEE-mc"
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Publish pinned osmfeatures to mavenLocal
        run: |
          set -euo pipefail
          chmod +x third_party/osmfeatures/publish-to-maven-local.sh
          ./third_party/osmfeatures/publish-to-maven-local.sh

      - name: Install xvfb for desktop Compose tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run unit tests with Gradle
        run: xvfb-run -a ./gradlew :app:testAndroidHostTest :app:desktopTest
