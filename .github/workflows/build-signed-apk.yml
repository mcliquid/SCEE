name: Build signed release APK

# Builds a signed Android release APK for SCEE-mc.
# - workflow_dispatch: uploads APK + SHA-256 as workflow artifacts only
# - push of tags matching v*: publishes a GitHub prerelease with the same assets
# Requires repository secrets: keystore, keystore_password, key_alias, key_password,
# sceemc_oauth2_client_id (optional sceemc_oauth2_client_id_test).
# Publishes de.westnordost.streetcomplete.expert.mc only.
# See res/documentation/scee-mc-github-release.md

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish pinned osmfeatures to mavenLocal
        run: |
          set -euo pipefail
          chmod +x third_party/osmfeatures/publish-to-maven-local.sh
          ./third_party/osmfeatures/publish-to-maven-local.sh

      - name: Resolve release names
        id: meta
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E '^app\.streetcomplete\.versionName=' gradle.properties | cut -d= -f2- | tr -d '\r')
          SHORT_SHA=$(git log -n 1 --format='%h')
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            ASSET_STEM="SCEE-mc-${TAG_NAME}"
          else
            TAG_NAME=""
            ASSET_STEM="SCEE-mc-${VERSION_NAME}-${SHORT_SHA}"
          fi
          {
            echo "version_name=${VERSION_NAME}"
            echo "short_sha=${SHORT_SHA}"
            echo "tag_name=${TAG_NAME}"
            echo "apk_name=${ASSET_STEM}.apk"
            echo "sum_name=${ASSET_STEM}.apk.sha256"
            echo "asset_stem=${ASSET_STEM}"
          } >> "$GITHUB_OUTPUT"

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.keystore }}
          STORE_PASSWORD: ${{ secrets.keystore_password }}
          KEY_ALIAS: ${{ secrets.key_alias }}
          KEY_PASSWORD: ${{ secrets.key_password }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required signing secret mapped to ${name}." >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "Refusing to build or publish an unsigned APK." >&2
            exit 1
          fi

      - name: Create keystore file
        env:
          KEYSTORE_BASE64: ${{ secrets.keystore }}
        run: |
          set -euo pipefail
          echo "${KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/signing-key.jks"
          test -s "${GITHUB_WORKSPACE}/signing-key.jks"

      - name: Inject SCEE-mc OAuth client id into Gradle properties
        env:
          # Public OAuth client IDs for the SCEE-mc OSM application (sceemc://oauth).
          SCEEMC_OAUTH2_CLIENT_ID: ${{ secrets.sceemc_oauth2_client_id }}
          SCEEMC_OAUTH2_CLIENT_ID_TEST: ${{ secrets.sceemc_oauth2_client_id_test }}
        run: |
          set -euo pipefail
          if [[ -z "${SCEEMC_OAUTH2_CLIENT_ID//[[:space:]]/}" ]]; then
            echo "Missing or blank secret 'sceemc_oauth2_client_id' (OSM OAuth 2 client id for sceemc://oauth)." >&2
            exit 1
          fi
          # Write into gradle.properties so BuildConfig generation cannot miss -P / config-cache edge cases.
          # Do not echo the client id.
          python3 - <<'PY'
          import os
          from pathlib import Path
          cid = os.environ["SCEEMC_OAUTH2_CLIENT_ID"].strip()
          assert cid, "blank OAuth client id"
          path = Path("gradle.properties")
          text = path.read_text(encoding="utf-8") if path.exists() else ""
          lines = [line for line in text.splitlines() if not line.startswith("app.sceemc.oauth2ClientId")]
          lines.append(f"app.sceemc.oauth2ClientId={cid}")
          test_cid = os.environ.get("SCEEMC_OAUTH2_CLIENT_ID_TEST", "").strip()
          if test_cid:
              lines.append(f"app.sceemc.oauth2ClientIdTest={test_cid}")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Injected app.sceemc.oauth2ClientId into gradle.properties (length={len(cid)}, value not logged)")
          PY

      - name: Build release APK with Gradle
        env:
          STORE_PASSWORD: ${{ secrets.keystore_password }}
          KEY_ALIAS: ${{ secrets.key_alias }}
          KEY_PASSWORD: ${{ secrets.key_password }}
        run: |
          set -euo pipefail
          # --no-configuration-cache: ensure OAuth BuildConfig fields are recomputed from gradle.properties
          ./gradlew :androidApp:assembleRelease --no-configuration-cache \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/signing-key.jks" \
            -Pandroid.injected.signing.store.password="${STORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Package APK and SHA-256
        id: package
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/release-assets"
          mkdir -p "${OUT_DIR}"
          SRC="androidApp/build/outputs/apk/release/androidApp-release.apk"
          UNSIGNED="androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk"
          if [[ -f "${UNSIGNED}" && ! -f "${SRC}" ]]; then
            echo "Gradle produced an unsigned APK; refusing to publish." >&2
            exit 1
          fi
          test -f "${SRC}"
          case "${SRC}" in
            *-unsigned.apk)
              echo "Refusing unsigned APK path: ${SRC}" >&2
              exit 1
              ;;
          esac
          APK_PATH="${OUT_DIR}/${{ steps.meta.outputs.apk_name }}"
          SUM_PATH="${OUT_DIR}/${{ steps.meta.outputs.sum_name }}"
          cp "${SRC}" "${APK_PATH}"
          (
            cd "${OUT_DIR}"
            sha256sum "${{ steps.meta.outputs.apk_name }}" | tee "${{ steps.meta.outputs.sum_name }}"
          )
          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "sum_path=${SUM_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature and package id
        run: |
          set -euo pipefail
          APK_PATH="${{ steps.package.outputs.apk_path }}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-${HOME}/Android/Sdk}}"
          APKSIGNER="$(find "${SDK_ROOT}" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          AAPT="$(find "${SDK_ROOT}" -type f \( -name aapt2 -o -name aapt \) 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${APKSIGNER}" ]]; then
            echo "apksigner not found under ${SDK_ROOT}; refusing to publish without APK Signature Scheme verification." >&2
            exit 1
          fi
          echo "Using apksigner: ${APKSIGNER}"
          "${APKSIGNER}" verify --verbose "${APK_PATH}"
          "${APKSIGNER}" verify --print-certs "${APK_PATH}" | tee "${RUNNER_TEMP}/apksigner-certs.txt"
          if [[ -z "${AAPT}" ]]; then
            echo "aapt/aapt2 not found under ${SDK_ROOT}; refusing to publish without package-id verification." >&2
            exit 1
          fi
          echo "Using aapt: ${AAPT}"
          BADGING="$("${AAPT}" dump badging "${APK_PATH}")"
          echo "${BADGING}" | grep -F "package: name='de.westnordost.streetcomplete.expert.mc'"
          if echo "${BADGING}" | grep -Eq "application-debuggable"; then
            echo "APK is debuggable; refusing to publish." >&2
            exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.asset_stem }}
          path: |
            release-assets/${{ steps.meta.outputs.apk_name }}
            release-assets/${{ steps.meta.outputs.sum_name }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag_name }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          SUM_NAME: ${{ steps.meta.outputs.sum_name }}
        run: |
          set -euo pipefail
          CHECKSUM=$(cut -d' ' -f1 "release-assets/${SUM_NAME}")
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## SCEE-mc ${TAG}"
            echo
            echo "Private SCEE-mc build from the \`SCEE-mc\` fork of [Helium314/SCEE](https://github.com/Helium314/SCEE) (itself a fork of StreetComplete)."
            echo "**Not** an official StreetComplete or SCEE release. Licensed under GPL-3.0; source for this build: this tag/commit."
            echo
            echo "- App versionName: \`${VERSION_NAME}\`"
            echo "- Application id: \`de.westnordost.streetcomplete.expert.mc\`"
            echo "- Commit: \`${SHORT_SHA}\`"
            echo "- Artifact: \`${APK_NAME}\`"
            echo "- SHA-256: \`${CHECKSUM}\`"
            echo
            echo "Install only if you trust this fork's signing key. This package id is independent of StreetComplete and SCEE, so SCEE-mc can be installed in parallel."
            echo
            echo "Note: Builds signed as \`de.westnordost.streetcomplete.expert\` (for example \`v64.0-mc.3\`) cannot be updated in place to this package id — install SCEE-mc alongside or uninstall the older package first (app data is not migrated)."
          } > "${NOTES_FILE}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "release-assets/${APK_NAME}" \
              "release-assets/${SUM_NAME}" \
              --clobber
            gh release edit "${TAG}" --prerelease --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" \
              "release-assets/${APK_NAME}" \
              "release-assets/${SUM_NAME}" \
              --prerelease \
              --title "SCEE-mc ${TAG}" \
              --notes-file "${NOTES_FILE}"
          fi

      - name: Remove keystore from runner
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/signing-key.jks"
