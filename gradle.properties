# debug settings in the app
debug=false

# Kotlin
kotlin.daemon.jvmargs=-Xmx4096m

# Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# Android
android.enableJetifier=false
android.useAndroidX=true

# Build scripts
POEditorAPIToken=invalid
POEditorCookie=invalid
POEditorPHPSESSID=invalid
GithubApiToken=invalid

kotlin.incremental=false
org.gradle.caching=false
org.gradle.java.home=C\:/Program Files/Java/jdk-22
kotlin.daemon.jvm.options=-Djava.home=C:/Program Files/Java/jdk-22
kotlin.compiler.execution.strategy=out-of-process
kotlin.compiler.verbose=true
