# debug settings in the app
app.streetcomplete.debug=false

# Kotlin
kotlin.daemon.jvmargs=-Xmx4096m
kotlin.incremental=true

# Gradle
# 8 gigabytes as maximum because during the linking of a Kotlin/Native release (i.e. iOS), more than
# 4 gigabytes is necessary, otherwise the task will fail with "e: Compilation failed: Java heap
# space" quickly.
# SCEE-mc: keep configuration-cache enabled (local preference); heap raised per SC for iOS linking.
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true

# Android
android.enableJetifier=false
android.useAndroidX=true

# Build scripts
app.streetcomplete.POEditorAPIToken=invalid
app.streetcomplete.POEditorCookie=invalid
app.streetcomplete.POEditorPHPSESSID=invalid
app.streetcomplete.GithubApiToken=invalid

org.gradle.java.home=C\:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot
kotlin.daemon.jvm.options=-Djava.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot
kotlin.compiler.execution.strategy=daemon
kotlin.compiler.verbose=true
