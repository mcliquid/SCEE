name: Actionlint

on:
  pull_request:
    branches:
      - "SCEE-mc"
    paths:
      - ".github/workflows/**"
      - ".github/scripts/dependency-snapshot-wait-lib.sh"
      - ".github/scripts/wait-for-pr-dependency-snapshot.sh"
      - ".github/scripts/wait-for-pr-dependency-snapshot.test.sh"
  push:
    branches:
      - "SCEE-mc"
    paths:
      - ".github/workflows/**"
      - ".github/scripts/dependency-snapshot-wait-lib.sh"
      - ".github/scripts/wait-for-pr-dependency-snapshot.sh"
      - ".github/scripts/wait-for-pr-dependency-snapshot.test.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.7"
      # sha256 of actionlint_1.7.7_linux_amd64.tar.gz (verified against upstream checksums file)
      ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
    steps:
      - uses: actions/checkout@v7

      # Pinned release binary; runs shellcheck on `run:` blocks (preinstalled on ubuntu-latest).
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint

      - name: Lint workflows
        run: |
          "${RUNNER_TEMP}/actionlint" -color

      - name: Dependency snapshot wait script tests
        run: |
          set -euo pipefail
          bash .github/scripts/wait-for-pr-dependency-snapshot.test.sh
